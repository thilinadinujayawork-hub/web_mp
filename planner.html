<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>UniHub - Planner</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<header>
		<nav class="navbar" aria-label="Primary">
			<a href="index.html" class="nav-logo">UniHub</a>

			<button class="hamburger-menu" type="button" aria-label="Toggle navigation" aria-expanded="false">
				<span></span>
				<span></span>
				<span></span>
			</button>

			<ul class="nav-links">
				<li><a href="index.html">Home</a></li>
				<li><a href="planner.html">Planner</a></li>
				<li><a href="community.html">Community</a></li>
				<li><a href="wellness.html">Wellness</a></li>
				<li><a href="events.html">Events</a></li>
				<li><a href="support.html">Support</a></li>
			</ul>

			<button id="theme-toggle" type="button" aria-label="Toggle dark and light mode">
				Dark / Light
			</button>
		</nav>
	</header>

	<main>
		<section class="daily-task-planner" aria-labelledby="task-planner-title">
			<h1 id="task-planner-title">Daily Task Planner</h1>
			<div class="task-input-group">
				<input type="text" id="task-input" placeholder="Enter a new task" aria-label="New task">
				<button type="button" id="add-task-button">Add Task</button>
			</div>
			<ul id="task-list"></ul>
		</section>

		<section class="productivity-timer" aria-labelledby="timer-title">
			<h2 id="timer-title">Productivity Timer</h2>
			<p class="timer-display" aria-live="polite">25:00</p>
			<div class="timer-controls">
				<button type="button" id="timer-start">Start</button>
				<button type="button" id="timer-pause">Pause</button>
				<button type="button" id="timer-reset">Reset</button>
			</div>
		</section>
	</main>

	<script src="js/planner.js" defer></script>
</body>
</html>
